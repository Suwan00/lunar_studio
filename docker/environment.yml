name: lunar_studio
channels:
  - conda-forge
  - usgs-astrogeology
  - defaults
dependencies:
  # Core Python runtime
  - python=3.11
  - embree=3.13.0

  # ISIS3 core dependencies
  - ale=0.10.0
  - boost=1.78.0
  - boost-cpp=1.78.0
  - bullet=2.86.1
  - cspice=67
  - csm>=3.0.3,<3.0.4
  - kakadu==1
  - usgscsm=2.0.2

  # Build toolchain
  - cmake>=3.27,<3.28
  - ninja>=1.7.2,<1.8
  - make=4.4.1
  - cxx-compiler=1.7

  # Required C/C++ libraries
  - eigen>=3,<4
  - qt-main>=5.15.8,<5.16
  - opencv>=4.7,<4.8
  - gsl>=2.6,<2.7
  - vtk>=9.2.6
  - pcl>=1.13.1
  - armadillo=14.0.3
  # inja — C++ templating library; required by upstream ISIS3 dev branch
  # (find_package(inja REQUIRED) in isis/CMakeLists.txt).
  - inja>=3.3,<3.6
  # nn — Pavel Sakov's Natural Neighbours interpolation library; ISIS3
  # uses it in several apps. FindNN.cmake looks for nn.h and libnn.
  - nn=1.86.0
  # nanoflann — header-only kd-tree library. Upstream ISIS3 used to vendor
  # it under isis/3rdParty/nanoflann but that copy was removed; we now rely
  # on the conda-forge nanoflann package (Findnanoflann.cmake looks for
  # nanoflann.hpp on the include path).
  - nanoflann>=1.5,<2.0

  # Geospatial / data formats
  - gdal>=3.7,<3.8
  - geos>=3.12,<3.13
  - geotiff=1.7.1
  - hdf5=1.14.1
  - libxml2=2.11.5
  - sqlite>=3.46.0,<3.47

  # Math and scientific libraries
  - blas=2.125
  - jama=125
  - tnt=126
  - nlohmann_json=3.11.2
  - suitesparse=5.10.1

  # Image processing
  - ffmpeg>=6.1.0
  - libtiff>=4.5,<4.6
  - libpng>=1.6.34,<1.7
  - libjpeg-turbo

  # Network / security
  - curl>=8.4.0,<8.5
  - openssl>=3.1.2,<3.2
  - krb5>=1.21.2

  # X11 / graphics
  - xorg-libx11
  - mesalib=17.3.9
  - qwt<6.3.0

  # Developer utilities
  - doxygen
  - graphviz
  - protobuf
  - zlib>=1.3,<1.4.0a0

  # Python scientific stack
  - numpy
  - pandas
  - scipy
  - pytest
  - h5py
  - plio
  - spiceypy

  # Pip-only packages (3D / plotting / ML utilities)
  - pip
  - pip:
    - open3d
    - plotly
    - dash
    - matplotlib
    - scikit-learn
    - requests
    - tqdm
    - pyquaternion
