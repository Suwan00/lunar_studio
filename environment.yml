name: cmake_luti
channels:
  - conda-forge
  - usgs-astrogeology
  - defaults
dependencies:
  # 기본 Python 환경
  - python=3.11
  - embree=3.13.0
  
  # ISIS3 핵심 의존성
  - ale=0.10.0
  - boost=1.78.0
  - boost-cpp=1.78.0
  - bullet=2.86.1
  - cspice=67
  - csm>=3.0.3,<3.0.4
  - kakadu==1
  - usgscsm=2.0.2
  
  # 빌드 도구
  - cmake>=3.27,<3.28
  - ninja>=1.7.2,<1.8
  - make=4.4.1
  - cxx-compiler=1.7
  
  # 필수 라이브러리
  - eigen>=3,<4
  - qt-main>=5.15.8,<5.16
  - opencv>=4.7,<4.8
  - gsl>=2.6,<2.7
  - vtk>=9.2.6
  - pcl>=1.13.1
  - armadillo=14.0.3
  
  # 데이터 처리 및 형식
  - gdal>=3.7,<3.8
  - geos>=3.12,<3.13
  - geotiff=1.7.1
  - hdf5=1.14.1
  - libxml2=2.11.5
  - sqlite>=3.46.0,<3.47
  
  # 수학 및 과학 라이브러리
  - blas=2.125
  - jama=125
  - tnt=126
  - nlohmann_json=3.11.2
  - suitesparse=5.10.1
  
  # 이미지 처리
  - ffmpeg>=6.1.0
  - libtiff>=4.5,<4.6
  - libpng>=1.6.34,<1.7
  - libjpeg-turbo
  
  # 네트워크 및 보안
  - curl>=8.4.0,<8.5
  - openssl>=3.1.2,<3.2
  - krb5>=1.21.2
  
  # X11 및 그래픽 관련
  - xorg-libx11
  - mesalib=17.3.9
  - qwt<6.3.0
  
  # 유틸리티
  - doxygen
  - graphviz
  - protobuf
  - zlib>=1.3,<1.4.0a0
  
  # Python 패키지
  - numpy
  - pandas
  - scipy
  - pytest
  - h5py
  - plio
  - spiceypy
  
  # pip 설치 패키지
  - pip
  - pip:
    - open3d
    - plotly
    - dash
    - matplotlib
    - scikit-learn
    - requests
    - tqdm
    - pyquaternion
